const $=s=>document.querySelector(s), norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g,''); const branches=[...new Set(C.map(x=>x.sucursal))].sort(), provinces=[...new Set(C.map(x=>x.provincia))].sort(); $('#branch').innerHTML='<option value="">Todas las sucursales</option>'+branches.map(x=>`<option>${x}</option>`).join(''); $('#province').innerHTML='<option value="">Todas las provincias</option>'+provinces.map(x=>`<option>${x}</option>`).join(''); function render(){const q=norm($('#q').value),b=$('#branch').value,p=$('#province').value,a=C.filter(x=>(!b||x.sucursal===b)&&(!p||x.provincia===p)&&norm(Object.values(x).join(' ')).includes(q)); const assigned=C.filter(x=>!x.sucursal.startsWith('PENDIENTE')).length,pending=C.length-assigned; $('#summary').innerHTML=`<div class="metric"><b>${C.length}</b><span>Cabañas relevadas</span></div><div class="metric"><b>${assigned}</b><span>Con asignación exacta</span></div><div class="metric"><b>${pending}</b><span>Pendientes de asignación</span></div><div class="metric"><b>${a.length}</b><span>Resultados visibles</span></div>`; $('#grid').innerHTML=a.length?a.map(x=>`<article class="card"><span class="tag ${x.sucursal.startsWith('PENDIENTE')?'pending':''}">${x.sucursal}</span><h2>${x.cabana}</h2><div class="loc">${x.localidad} · ${x.provincia}</div><div class="act">${x.actividad}</div></article>`).join(''):'<div class="empty">No hay cabañas para esos filtros.</div>'}['q','branch','province'].forEach(id=>$('#'+id).addEventListener('input',render));render();
