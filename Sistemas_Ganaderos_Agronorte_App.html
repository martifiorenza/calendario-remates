<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistemas Productivos Ganaderos y Tambo — Agronorte</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --green:#166534; --green-dark:#14532D; --green-light:#E5F8EC;
  --orange:#FFA400; --orange-light:#FFF2DC;
  --yellow:#FFDB00;
  --ink:#141818; --ink-2:#1F2622;
  --paper:#F3F4F6; --card:#FFFFFF; --line:#E1E7E0;
  --text:#1B211C; --text-mute:#5C665D;
  --font-display:'Nunito Sans',system-ui,sans-serif;
  --font-body:'Nunito Sans',system-ui,sans-serif;
  --font-mono:'Nunito Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{font-family:var(--font-body); background:var(--paper); color:var(--text); -webkit-font-smoothing:antialiased;}
::selection{background:var(--yellow); color:var(--ink);}
.app{display:flex; min-height:100vh;}

/* ---------- SIDEBAR ---------- */
.sidebar{
  width:272px; flex-shrink:0; background:var(--ink); color:#EDEFEC;
  display:flex; flex-direction:column; position:sticky; top:0; height:100vh; overflow-y:auto;
}
.sidebar-logo{padding:22px 20px 14px; }
.sidebar-logo .card-wrap{background:#fff; border-radius:10px; padding:10px 14px; display:inline-block;}
.sidebar-logo img{height:26px; display:block;}
.sidebar-sub{padding:0 20px 16px; font-size:12.5px; color:#9AA39B; line-height:1.5; border-bottom:1px solid #262E28;}
.nav{list-style:none; margin:0; padding:10px 12px; flex:1;}
.nav-group-label{font-family:var(--font-display); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#7C867D; padding:14px 10px 6px;}
.nav-item{
  display:flex; align-items:center; gap:11px; padding:10px 10px; border-radius:9px; cursor:pointer;
  font-size:14.5px; font-weight:500; color:#CBD1CA; transition:background .15s ease, color .15s ease;
  margin-bottom:2px;
}
.nav-item:hover{background:#20281F; color:#fff;}
.nav-item.active{background:#20281F; color:#fff;}
.nav-dot{width:26px; height:26px; border-radius:7px; flex-shrink:0; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:10.5px; font-weight:700; color:#fff;}
.nav-item.active .nav-dot{box-shadow:0 0 0 2px rgba(255,255,255,.25);}
.sidebar-foot{padding:16px 20px 20px; font-size:11px; color:#6D766E; border-top:1px solid #262E28; line-height:1.6;}

/* ---------- MAIN ---------- */
.main{flex:1; min-width:0; display:flex; flex-direction:column;}
.topbar{
  background:var(--card); border-bottom:1px solid var(--line); padding:26px 40px 0;
  position:sticky; top:0; z-index:5;
}
.topbar-inner{max-width:980px;}
.brand-row{display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:10px;}
.brand-pill{
  display:inline-flex; align-items:center; background:#fff; border:1px solid rgba(22,101,52,.14);
  border-radius:12px; padding:7px 11px;
  box-shadow:0 1px 3px rgba(0,0,0,.06);
}
.brand-logo{display:block; height:26px; width:auto;}
.back-link{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:var(--green); color:#fff; text-decoration:none; border-radius:9px;
  padding:8px 12px; font-size:13px; font-weight:700; box-shadow:0 1px 3px rgba(0,0,0,.14);
}
.back-link:hover{background:var(--green-dark);}
.eyebrow{font-family:var(--font-mono); font-size:12px; letter-spacing:.08em; color:var(--green-dark); text-transform:uppercase; font-weight:700;}
.page-title{font-family:var(--font-display); font-weight:800; font-size:44px; line-height:1; margin:6px 0 8px; text-transform:uppercase; letter-spacing:.01em;}
.page-desc{font-size:15px; color:var(--text-mute); max-width:640px; margin-bottom:20px; line-height:1.5;}
.tabbar{display:flex; gap:4px; margin-top:6px;}
.tabbtn{
  font-family:var(--font-body); font-size:14px; font-weight:600; color:var(--text-mute);
  background:none; border:none; padding:12px 4px; margin-right:22px; cursor:pointer;
  border-bottom:3px solid transparent; transition:color .15s ease, border-color .15s ease;
}
.tabbtn:hover{color:var(--ink);}
.tabbtn.active{color:var(--ink); border-bottom-color:var(--green);}

.content{padding:32px 40px 80px; max-width:980px;}
.content-inner{animation:fadeIn .28s ease;}
@keyframes fadeIn{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}

h3.sec{font-family:var(--font-display); font-size:22px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; margin:34px 0 12px; color:var(--ink);}
h3.sec:first-child{margin-top:0;}
h4.sub{font-size:15.5px; font-weight:700; margin:20px 0 8px; color:var(--ink);}
p{font-size:15px; line-height:1.65; color:var(--text); margin:0 0 14px;}
ul.list, ol.list{margin:0 0 16px; padding-left:20px;}
ul.list li, ol.list li{font-size:15px; line-height:1.6; margin-bottom:7px; color:var(--text);}
strong{color:var(--ink);}

.callout{background:var(--green-light); border-radius:12px; padding:18px 20px; margin:18px 0;}
.callout.orange{background:var(--orange-light);}
.callout.dark{background:var(--ink); color:#fff;}
.callout.dark p{color:#E7EAE6;}
.callout-label{font-family:var(--font-mono); font-size:11.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--green-dark); margin-bottom:6px;}
.callout.orange .callout-label{color:#9A5F00;}
.callout.dark .callout-label{color:var(--yellow);}
.callout p{margin:0; font-size:14.5px;}

table.data{width:100%; border-collapse:collapse; margin:14px 0 22px; font-size:14px;}
table.data th{font-family:var(--font-mono); font-size:11.5px; text-transform:uppercase; letter-spacing:.04em; text-align:left; background:var(--ink); color:#fff; padding:9px 12px;}
table.data td{padding:10px 12px; border-bottom:1px solid var(--line); color:var(--text);}
table.data tr:nth-child(even) td{background:#FAFBF9;}
table.data td.num{font-family:var(--font-mono); font-weight:700;}

.stat-row{display:flex; gap:14px; flex-wrap:wrap; margin:18px 0 26px;}
.stat-card{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; flex:1; min-width:150px;}
.stat-num{font-family:var(--font-mono); font-weight:700; font-size:26px; color:var(--green-dark);}
.stat-num.o{color:#B5650A;}
.stat-lbl{font-size:12.5px; color:var(--text-mute); margin-top:4px; line-height:1.4;}

.gauge-wrap{display:flex; align-items:center; gap:22px; background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 24px; margin:20px 0 26px;}
.gauge-text{flex:1;}
.gauge-value{font-family:var(--font-mono); font-weight:700; font-size:28px; color:var(--ink);}
.gauge-label{font-size:13px; color:var(--text-mute); margin-top:4px; line-height:1.4; max-width:360px;}

.pill{display:inline-block; font-family:var(--font-mono); font-size:11.5px; font-weight:700; padding:4px 10px; border-radius:999px; letter-spacing:.03em;}
.pill.fav{background:var(--green-light); color:var(--green-dark);}
.pill.mix{background:var(--orange-light); color:#9A5F00;}
.pill.dem{background:#FBE7E4; color:#A13B2E;}

.twocol{display:grid; grid-template-columns:1fr 1fr; gap:18px; margin:18px 0 26px;}
@media (max-width:760px){.twocol{grid-template-columns:1fr;}}
.col-card{border-radius:14px; padding:20px 22px;}
.col-card.good{background:var(--green-light);}
.col-card.bad{background:#FBE7E4;}
.col-title{font-family:var(--font-display); font-size:17px; font-weight:800; letter-spacing:.02em; text-transform:uppercase; margin-bottom:10px;}
.col-card.good .col-title{color:var(--green-dark);}
.col-card.bad .col-title{color:#A13B2E;}
.col-card ul{margin:0; padding-left:18px;}
.col-card li{font-size:14px; margin-bottom:8px; line-height:1.5;}

.chip-row{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
.chip{font-family:var(--font-mono); font-size:12px; padding:5px 11px; border-radius:7px; background:#EEF2ED; color:var(--text-mute); font-weight:600;}

.footer-src{font-size:12px; color:var(--text-mute); font-style:italic; border-top:1px solid var(--line); padding-top:14px; margin-top:30px; line-height:1.6;}

/* HOME */
.home-hero{padding:6px 0 10px;}
.home-hero h1{font-family:var(--font-display); font-weight:800; font-size:52px; line-height:1.02; text-transform:uppercase; margin:10px 0 14px; max-width:760px;}
.home-hero p.lead{font-size:17px; color:var(--text-mute); max-width:600px; line-height:1.6; margin-bottom:0;}
.grid6{display:grid; grid-template-columns:repeat(3,1fr); gap:14px; margin-top:34px;}
@media (max-width:900px){.grid6{grid-template-columns:repeat(2,1fr);}}
@media (max-width:600px){.grid6{grid-template-columns:1fr;}}
.sys-card{
  background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px; cursor:pointer;
  transition:transform .15s ease, box-shadow .15s ease; position:relative; overflow:hidden;
}
.sys-card:hover{transform:translateY(-3px); box-shadow:0 10px 24px rgba(20,24,24,.09);}
.sys-card .tag{width:38px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-weight:700; font-size:13px; color:#fff; margin-bottom:14px;}
.sys-card h4{font-family:var(--font-display); font-size:21px; font-weight:800; text-transform:uppercase; margin:0 0 6px;}
.sys-card p{font-size:13.5px; color:var(--text-mute); margin:0;}
.sys-card .arrow{position:absolute; right:18px; top:18px; font-size:18px; color:var(--line); transition:color .15s ease;}
.sys-card:hover .arrow{color:var(--green);}

/* Mobile nav */
.mobile-topbar{display:none;}
@media (max-width:880px){
  .sidebar{position:fixed; left:0; top:0; height:100vh; z-index:30; transform:translateX(-100%); transition:transform .2s ease; width:82vw; max-width:300px;}
  .sidebar.open{transform:translateX(0);}
  .mobile-topbar{display:flex; align-items:center; gap:12px; padding:14px 18px; background:var(--ink); position:sticky; top:0; z-index:20;}
  .mobile-topbar img{height:18px;}
  .burger{width:34px; height:34px; border-radius:8px; background:#20281F; border:none; color:#fff; font-size:18px; cursor:pointer;}
  .overlay{display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:25;}
  .overlay.show{display:block;}
  .topbar{padding:20px 20px 0;}
  .content{padding:24px 20px 60px;}
  .page-title{font-size:32px;}
  .home-hero h1{font-size:34px;}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important; transition:none !important;}}
</style>
</head>

<script>
const COLORS = { green:"#007E19", orange:"#FFA400", ink:"#141818" };

function gaugeSVG(value, max, unit, opts){
  opts = opts || {};
  const color = opts.color || COLORS.green;
  const pct = Math.max(0, Math.min(100, (value/max)*100));
  const cx=100, cy=100, r=80;
  const totalLen = Math.PI * r;
  const dash = (pct/100) * totalLen;
  const angle = 180 - (pct/100)*180;
  const rad = angle * Math.PI/180;
  const nx = cx + (r-18) * Math.cos(rad);
  const ny = cy - (r-18) * Math.sin(rad);
  const valText = (Number.isInteger(value) ? value : value.toString().replace('.', ','));
  return `
  <svg viewBox="0 0 200 118" width="150" height="89">
    <path d="M20,100 A80,80 0 0,1 180,100" fill="none" stroke="#E7EBE6" stroke-width="15" stroke-linecap="round"/>
    <path d="M20,100 A80,80 0 0,1 180,100" fill="none" stroke="${color}" stroke-width="15" stroke-linecap="round"
          stroke-dasharray="${dash.toFixed(1)} ${totalLen.toFixed(1)}"/>
    <circle cx="20" cy="100" r="3.4" fill="#B9C1B7"/>
    <circle cx="100" cy="20" r="3.4" fill="#B9C1B7"/>
    <circle cx="180" cy="100" r="3.4" fill="#B9C1B7"/>
    <line x1="${cx}" y1="${cy}" x2="${nx.toFixed(1)}" y2="${ny.toFixed(1)}" stroke="${COLORS.ink}" stroke-width="4" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="7" fill="${COLORS.ink}"/>
  </svg>`;
}

function gaugeBlock(value, max, unit, label, color){
  const displayVal = (typeof value === 'number' && value % 1 !== 0) ? value.toString().replace('.', ',') : value;
  return `<div class="gauge-wrap">
    ${gaugeSVG(value, max, unit, {color: color})}
    <div class="gauge-text">
      <div class="gauge-value">${displayVal}${unit ? ' ' + unit : ''}</div>
      <div class="gauge-label">${label}</div>
    </div>
  </div>`;
}

const SYSTEMS = [
  {
    id:"cria", name:"Cría", tag:"CR", color:COLORS.green,
    short:"Produce el ternero destetado.",
    gauge:{value:85, max:100, unit:"%", label:"% de destete — objetivo de manejo de un rodeo eficiente", color:COLORS.green},
    tabs:{
      principios: `
        <h3 class="sec">Qué es</h3>
        <p>La cría transforma un <strong>vientre</strong> en un <strong>ternero destetado</strong>. Es el primer eslabón de toda la cadena, tanto para carne como para tambo: la vaquillona de reposición de un tambo también nace y se cría antes de entrar en producción.</p>
        <div class="chip-row">
          <span class="chip">Vientre</span><span class="chip">→</span><span class="chip">Preñez</span><span class="chip">→</span>
          <span class="chip">Parto</span><span class="chip">→</span><span class="chip">Lactancia</span><span class="chip">→</span><span class="chip">Destete</span>
        </div>
        <h3 class="sec">El animal en kilos</h3>
        <table class="data"><tr><th>Momento</th><th>Peso vivo</th><th>Qué ocurre</th></tr>
          <tr><td>Nacimiento</td><td class="num">25-40 kg</td><td>El ternero nace y depende de la madre.</td></tr>
          <tr><td>Destete</td><td class="num">160-220 kg</td><td>Se separa de la madre; puede venderse o continuar en la empresa.</td></tr>
        </table>
        <h3 class="sec">Categorías básicas</h3>
        <ul class="list">
          <li><strong>Vaca:</strong> hembra que ya parió.</li>
          <li><strong>Vaquillona:</strong> hembra destetada que todavía no parió.</li>
          <li><strong>Toro:</strong> macho entero destinado a reproducción.</li>
          <li><strong>Ternero/a:</strong> cría al pie de la madre, antes del destete.</li>
        </ul>
        <h3 class="sec">Servicio continuo vs. estacionado</h3>
        <p>Un servicio <strong>estacionado</strong> (los toros entran y salen del rodeo en una ventana acotada, típicamente 3 meses) concentra las pariciones, permite planificar sanidad, destete y venta, y produce terneros más parejos que un servicio continuo. La cátedra usa como ejemplo típico un <strong>servicio estacionado octubre-noviembre-diciembre</strong>.</p>
      `,
      datos: `
        <h3 class="sec">KPI centrales</h3>
        <div class="stat-row">
          <div class="stat-card"><div class="stat-num">85-90%</div><div class="stat-lbl">% destete en un rodeo bien manejado</div></div>
          <div class="stat-card"><div class="stat-num o">180 kg</div><div class="stat-lbl">Peso al destete, referencia</div></div>
          <div class="stat-card"><div class="stat-num">283 días</div><div class="stat-lbl">Duración de la gestación</div></div>
        </div>
        <h3 class="sec">Fórmulas de índices (cátedra)</h3>
        <table class="data"><tr><th>Índice</th><th>Fórmula</th></tr>
          <tr><td>Reposición anual (%)</td><td>(Refugo por ventas + mortandad) / Vientres entorados × 100</td></tr>
          <tr><td>Rendimiento de los vientres (%)</td><td>% Destete − % Reposición</td></tr>
          <tr><td>Relación vientres/stock (%)</td><td>Vientres / Total de animales × 100</td></tr>
          <tr><td>Rendimiento del rodeo (%)</td><td>Rendimiento de los vientres × Relación vientres/stock</td></tr>
          <tr><td>Participación de terneros en ventas (%)</td><td>Terneros vendidos / Total vendido × 100</td></tr>
          <tr><td>Producción anual (kg/ha)</td><td>(Salidas − Entradas ± Dif. inventario) / Superficie</td></tr>
          <tr><td>Eficiencia del stock (%)</td><td>Producción anual (kg/ha) / Carga animal (kg/ha) × 100</td></tr>
        </table>
        <h3 class="sec">Por qué el servicio se ubica en primavera-verano</h3>
        <p>El objetivo es lograr un ternero por vaca por año. De los 365 días del ciclo, ~283 son de gestación: quedan apenas <strong>82 días</strong> para volver a preñarse, de los cuales el organismo necesita ~40 días de <strong>anestro posparto</strong> solo para recuperar el útero. Cuánto tarde en salir de ese anestro depende de la condición corporal — que depende de cuánto y qué tan bien está comiendo, es decir, de la curva de pasto.</p>
        <div class="callout dark">
          <div class="callout-label">Sincronización</div>
          <p>Un servicio octubre-diciembre da partos concentrados a fines de invierno / inicio de primavera del año siguiente — justo cuando el pasto vuelve a crecer y la vaca necesita más energía para producir leche y volver a preñarse. El requerimiento de la vaca sube junto con la lactancia y llega a su pico cuando el pasto todavía viene creciendo; tras el destete (~7 meses posparto) el requerimiento cae fuerte, coincidiendo con la caída de la oferta de pasto en otoño-invierno.</p>
        </div>
      `,
      manejo: `
        <h3 class="sec">Distribución de las pariciones</h3>
        <p>No da lo mismo que las vacas se preñen al principio, en el medio o al final de la temporada de servicio. Un rodeo con partos concentrados <strong>"de cabeza"</strong> desteta terneros más parejos y más pesados que uno con partos <strong>"a la cola"</strong>, porque todos tienen más días de pasto de calidad al momento del destete. Corregir esta distribución es una de las prácticas de manejo con más impacto en los kilos totales producidos por hectárea.</p>
        <h3 class="sec">Condición corporal</h3>
        <p>Es una escala visual/táctil del estado de reservas de la vaca. Sirve para anticipar, <strong>antes del servicio</strong>, si una vaca va a tener problemas para volver a preñarse — en lugar de descubrirlo recién en el tacto. Una vaca flaca al parto tarda más en salir del anestro, lo que reduce directamente la tasa de preñez del rodeo (sobre todo en el 2° servicio de las vaquillonas de primera cría).</p>
        <h3 class="sec">Preguntas para el productor</h3>
        <ul class="list">
          <li>¿Cuándo entran los toros y cuánto dura el servicio?</li>
          <li>¿Qué % de preñez y destete lográs, y cómo se distribuyen las pariciones?</li>
          <li>¿Mirás la condición corporal antes del servicio?</li>
          <li>¿Retenés hembras o vendés al destete?</li>
        </ul>
        <div class="callout">
          <div class="callout-label">Riesgo dominante</div>
          <p>Clima y forraje disponible + stock de vientres. Un ternero caro en el mercado no corrige una baja eficiencia reproductiva propia.</p>
        </div>
      `,
      actualidad: `
        <div class="chip-row"><span class="pill fav">FAVORABLE</span></div>

  <h3 class="sec">Cómo funciona un remate, paso a paso</h3>
  <p>El remate es el mecanismo detrás de tres de los cinco canales de venta (mercado concentrador, remate feria y venta por pantalla). No todos funcionan igual.</p>
  <table class="data"><tr><th>Tipo de remate</th><th>Cómo es</th><th>Ejemplo</th></tr>
    <tr><td>En mercado concentrador</td><td>La hacienda viaja físicamente hasta el mercado; remata todos los días.</td><td>Liniers (Bs. As.), Ferreyra (Córdoba)</td></tr>

    <tr><td>De exposición</td><td>Animales de pedigrí o reproductores, no hacienda para faena.</td><td>Exposiciones de razas</td></tr>
  </table>

  <h4 class="sub">Remate presencial (feria o mercado concentrador)</h4>
  <ol class="list">
    <li><strong>Ingreso y control:</strong> se verifica cantidad, categoría y documentación (DTe/guía) de la tropa.</li>
    <li><strong>Desbaste:</strong> el animal llega y durante la noche pierde peso (líquidos, contenido digestivo) por el ayuno del viaje. El peso que cuenta para la venta es el del día siguiente, ya "desbastado" — es plata que el productor pierde en el traslado, no en la venta en sí.</li>
    <li><strong>Loteo:</strong> se clasifica la tropa en corrales por categoría, clase y estado, y se anota en el libro del mercado: vendedor, corral, condiciones de venta.</li>
    <li><strong>Subasta:</strong> el rematador recibe la "tropa en la pista" y remata a viva voz; compradores (frigoríficos, invernadores, feedlots, otros consignatarios comprando para terceros) pujan y se adjudica al mejor postor.</li>
  </ol>

  <h4 class="sub">Remate por pantalla</h4>
  <ol class="list">
    <li>Cada lote se publica con antelación (fotos, video, peso promedio, categoría, ubicación) — en Liniers, por ejemplo, los consignatarios suben el catálogo unas 72 horas antes.</li>
    <li>Al arrancar cada lote, el rematador informa los términos: precio base, plazo de pago, quién paga el flete.</li>
    <li>Los compradores pujan en tiempo real desde una pantalla; se cierra al mejor postor.</li>
    <li>Recién ahí se organiza el traslado — directo del campo al comprador, sin pasar por el mercado.</li>
  </ol>
  <div class="callout orange">
    <div class="callout-label">La ventaja concreta de vender por pantalla</div>
    <p>Al pesarse en origen, se evita el desbaste del viaje especulativo hasta el mercado, y se ahorra un flete (el que antes iba "a ver si se vendía"). Menos manipuleo también significa menos estrés y riesgo sanitario para el animal.</p>
  </div>

  <h4 class="sub">Cuánto cuesta vender por remate</h4>
  <p>Sobre el valor de la operación se suman: comisión del consignatario, garantía de pago (si el consignatario la ofrece), gastos del mercado (derecho de piso, seguro) si es concentrador, impuestos (IIBB, Ganancias), y costos fijos por cabeza (guía/DTe, flete). Un estudio universitario (UNS) que comparó vías de comercialización encontró que vender por Liniers implicaba cerca del <strong>14% del valor de venta en costos totales</strong> — de los cuales las comisiones eran ~40% de esos costos y el flete ~37% (por la distancia al mercado). La venta directa y la venta por pantalla suelen salir más baratas, principalmente porque se ahorran ese flete.</p>

  <h4 class="sub">Cuándo cobra el productor</h4>
  <p>El consignatario emite una <strong>liquidación de venta</strong> (romaneo): peso, precio, descuentos, comisión, y el neto a cobrar. El plazo de pago depende de si el consignatario ofrece "garantía de pago" (cobra más rápido, con menos riesgo) o no. Vender por remate casi siempre implica esperar esa liquidación, a diferencia de una venta directa donde el plazo se negocia directamente con el comprador.</p>

  <h3 class="sec">La cadena láctea es distinta</h3>
  <p>En tambo no hay remate ni consignatario: la leche sale del tambo <strong>todos los días</strong> en camión cisterna y va directo a la planta industrializadora, casi siempre bajo un contrato o una relación estable con una industria o cooperativa. El precio no se define en un mercado concentrador — se negocia según composición (grasa, proteína, células somáticas) y condiciones comerciales pactadas, y suele liquidarse mensualmente.</p>

  <h3 class="sec">Por qué le importa al gerente de sucursal</h3>
  <p>El canal de venta no es un detalle administrativo: define el <strong>momento de cobro</strong> del cliente. Una venta directa puede cobrarse en pocos días; una consignación o un remate feria puede demorar más; el tambo cobra mensualmente contra la industria. Antes de hablar de una inversión, vale la pena entender por dónde vende el cliente y cuándo entra esa plata — no solo cuánto vale su hacienda o su leche.</p>

  <div class="footer-src">Fuentes: Comisión Nacional de Defensa de la Competencia (CNDC), Resumen del Mercado Argentino de la Carne Vacuna; Mercado de Liniers S.A.; SENASA (sistema SIGSA, DT-e, RENSPA); AFIP/ARCA (RUCA); Diez, M. — Circuitos de comercialización de hacienda vacuna, Universidad Nacional del Sur (comparación de costos por canal); Filadd/UES21, Resumen Historia Remate de Hacienda. Estructura general del canal — los porcentajes de costos son de estudios puntuales y varían según consignataria, distancia y momento; verificar valores vigentes antes de una gestión concreta.</div>
`;

const TAB_LABELS = { principios:"Principios generales", datos:"Datos productivos", manejo:"Manejo y decisiones", actualidad:"Actualidad 2026" };
const TAB_ORDER = ["principios","datos","manejo","actualidad"];

const NAV_ITEMS = [
  {id:"inicio", name:"Inicio", tag:"•", color:"#4A544B"},
  ...SYSTEMS.map(s => ({id:s.id, name:s.name, tag:s.tag, color:s.color})),
  {id:"comun", name:"Lo común a todos", tag:"=", color:"#4A544B"},
  {id:"comercializacion", name:"Cadena de comercialización", tag:"$", color:"#4A544B"},
  {id:"panorama", name:"Panorama 2026", tag:"%", color:COLORS.orange},
];

let state = { nav:"inicio", tab:"principios" };

function getSystem(id){ return SYSTEMS.find(s => s.id === id); }

function renderNav(){
  const el = document.getElementById("navList");
  el.innerHTML = "";
  const label1 = document.createElement("li"); label1.className="nav-group-label"; label1.textContent="Guía"; el.appendChild(label1);
  addNavItem(el, NAV_ITEMS[0]);
  const label2 = document.createElement("li"); label2.className="nav-group-label"; label2.textContent="Sistemas productivos"; el.appendChild(label2);
  NAV_ITEMS.slice(1,7).forEach(it => addNavItem(el, it));
  const label3 = document.createElement("li"); label3.className="nav-group-label"; label3.textContent="Transversal"; el.appendChild(label3);
  NAV_ITEMS.slice(7).forEach(it => addNavItem(el, it));
}

function addNavItem(el, it){
  const li = document.createElement("li");
  li.className = "nav-item" + (state.nav === it.id ? " active" : "");
  li.innerHTML = `<span class="nav-dot" style="background:${it.color}">${it.tag}</span><span>${it.name}</span>`;
  li.addEventListener("click", () => { state.nav = it.id; state.tab = "principios"; render(); closeMobileNav(); });
  el.appendChild(li);
}

function render(){
  renderNav();
  const topbar = document.getElementById("topbar");
  const eyebrow = document.getElementById("eyebrow");
  const title = document.getElementById("pageTitle");
  const desc = document.getElementById("pageDesc");
  const tabbar = document.getElementById("tabbar");
  const content = document.getElementById("content");

  if(state.nav === "inicio"){
    eyebrow.textContent = "Agronorte · Guía interna";
    title.textContent = "Sistemas productivos ganaderos y tambo";
    desc.textContent = "Elegí un sistema para profundizar: principios generales, datos productivos, manejo y decisiones, y actualidad 2026.";
    tabbar.innerHTML = "";
    content.innerHTML = renderHome();
    wireHomeCards();
    return;
  }

  if(state.nav === "comun"){
    eyebrow.textContent = "Transversal";
    title.textContent = "Lo común a todos";
    desc.textContent = "Lo que se repite en cría, recría, invernada, feedlot, ciclo completo y tambo — una sola vez.";
    tabbar.innerHTML = "";
    content.innerHTML = COMUN_HTML;
    return;
  }

  if(state.nav === "comercializacion"){
    eyebrow.textContent = "Transversal";
    title.textContent = "Cadena de comercialización";
    desc.textContent = "Cómo llega la hacienda (o la leche) del campo al frigorífico o la industria — y por dónde pasa la plata.";
    tabbar.innerHTML = "";
    content.innerHTML = COMERCIALIZACION_HTML;
    return;
  }

  if(state.nav === "panorama"){
    eyebrow.textContent = "Transversal";
    title.textContent = "Panorama económico 2026";
    desc.textContent = "Argentina, mediados de 2026 — qué ayuda y qué complica al productor ganadero, sistema por sistema.";
    tabbar.innerHTML = "";
    content.innerHTML = PANORAMA_HTML;
    return;
  }

  const sys = getSystem(state.nav);
  eyebrow.textContent = "Sistema productivo";
  title.textContent = sys.name;
  desc.textContent = sys.short;
  tabbar.innerHTML = TAB_ORDER.map(t =>
    `<button class="tabbtn${state.tab===t?" active":""}" data-tab="${t}">${TAB_LABELS[t]}</button>`
  ).join("");
  Array.from(tabbar.querySelectorAll(".tabbtn")).forEach(btn=>{
    btn.addEventListener("click", ()=>{ state.tab = btn.dataset.tab; render(); });
  });

  let gaugeHtml = "";
  if(state.tab === "principios"){
    gaugeHtml = gaugeBlock(sys.gauge.value, sys.gauge.max, sys.gauge.unit, sys.gauge.label, sys.gauge.color);
  }
  content.innerHTML = gaugeHtml + sys.tabs[state.tab];
}

function renderHome(){
  const cards = SYSTEMS.map(s => `
    <div class="sys-card" data-nav="${s.id}">
      <span class="arrow">→</span>
      <div class="tag" style="background:${s.color}">${s.tag}</div>
      <h4>${s.name}</h4>
      <p>${s.short}</p>
    </div>
  `).join("");
  const extraCards = `
    <div class="sys-card" data-nav="comun">
      <span class="arrow">→</span>
      <div class="tag" style="background:#4A544B">=</div>
      <h4>Lo común a todos</h4>
      <p>Capital, tiempo, decisión marginal y balance forrajero.</p>
    </div>
    <div class="sys-card" data-nav="comercializacion">
      <span class="arrow">→</span>
      <div class="tag" style="background:#4A544B">$</div>
      <h4>Cadena de comercialización</h4>
      <p>Canales de venta, actores, documentación y trazabilidad.</p>
    </div>
    <div class="sys-card" data-nav="panorama">
      <span class="arrow">→</span>
      <div class="tag" style="background:${COLORS.orange}">%</div>
      <h4>Panorama 2026</h4>
      <p>Qué beneficia y qué perjudica al productor hoy.</p>
    </div>
  `;
  return `
    <div class="home-hero">
      <p class="lead">Toda la ganadería —de carne o de leche— arranca del mismo vientre. Esta guía separa cada sistema en cuatro capas: de qué se trata, qué números lo describen, cómo se maneja en la práctica, y cómo le está yendo hoy.</p>
    </div>
    <div class="grid6">${cards}${extraCards}</div>
  `;
}

function wireHomeCards(){
  document.querySelectorAll(".sys-card").forEach(card=>{
    card.addEventListener("click", ()=>{ state.nav = card.dataset.nav; state.tab="principios"; render(); window.scrollTo(0,0); });
  });
}

// mobile nav
function closeMobileNav(){
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}
document.getElementById("burgerBtn").addEventListener("click", ()=>{
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
});
document.getElementById("overlay").addEventListener("click", closeMobileNav);

render();
</script>
</body>
</html>
