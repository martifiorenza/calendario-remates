<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Remates ganaderos 2026</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23dcfce7'/%3E%3Cpath d='M18 18c-5 0-8 3-8 7 0 3 2 5 5 6-1 4 0 10 4 13 3 3 7 4 13 4s10-1 13-4c4-3 5-9 4-13 3-1 5-3 5-6 0-4-3-7-8-7-3 0-5 1-7 3-2-1-4-2-7-2s-5 1-7 2c-2-2-4-3-7-3z' fill='%23fff' stroke='%23166534' stroke-width='3'/%3E%3Cpath d='M23 22c-3 0-6 2-6 6 0 2 1 4 3 5 2-3 5-6 9-8-1-2-3-3-6-3zM41 22c3 0 6 2 6 6 0 2-1 4-3 5-2-3-5-6-9-8 1-2 3-3 6-3z' fill='%23171717'/%3E%3Ccircle cx='25' cy='34' r='3' fill='%23171717'/%3E%3Ccircle cx='39' cy='34' r='3' fill='%23171717'/%3E%3Cellipse cx='32' cy='43' rx='10' ry='7' fill='%23fecaca'/%3E%3Ccircle cx='28' cy='43' r='1.7' fill='%237f1d1d'/%3E%3Ccircle cx='36' cy='43' r='1.7' fill='%237f1d1d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  html,body{margin:0;padding:0;background:#DCFCE7;}
  #root{min-height:100vh;}
  .evt:hover{background:#ecfdf5 !important}
  .rowitem:hover{box-shadow:0 2px 10px #0001;transform:translateY(-1px);transition:all .12s}
  *{box-sizing:border-box}
  .loadwrap{display:flex;align-items:center;justify-content:center;height:100vh;
    font-family:'Inter',system-ui,sans-serif;color:#888;font-size:15px;flex-direction:column;gap:14px}
  .spin{width:34px;height:34px;border:3px solid #0001;border-top-color:#B45309;border-radius:50%;
    animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .errbox{max-width:520px;font-family:'Inter',system-ui,sans-serif;padding:24px;text-align:center;line-height:1.5}
  .errbox code{background:#0001;padding:2px 6px;border-radius:4px;font-size:13px}
</style>
</head>
<body>
<div id="root">
  <div class="loadwrap"><div class="spin"></div><div>Cargando remates…</div></div>
</div>

<script type="text/plain" id="app-src">
const { useState, useEffect } = React;

const rootEl = document.getElementById("root");
function showFatal(msg){
  rootEl.innerHTML = `<div class="loadwrap"><div class="errbox"><b>${msg}</b><br/><br/>Revisá que carguen React, ReactDOM y Babel, y que <code>remates.json</code> esté publicado en la raíz del sitio.</div></div>`;
}

if (!window.React || !window.ReactDOM || !window.Babel) {
  showFatal("No cargaron las dependencias de JavaScript");
  throw new Error("Missing React/ReactDOM/Babel");
}

const GRUPO_COLOR = {
  "e-Brangus": "#C2410C", "AFA":"#0E7490", "Pastore":"#7C3AED",
  "Charles":"#BE185D", "Lehmann":"#15803D", "Rosgan":"#B45309",
  "Exposiciones":"#1D4ED8",
};
const PROV_LIST = ["Santa Fe","Entre Ríos","Córdoba","Corrientes","Misiones"];
const GRUPOS = ["e-Brangus","AFA","Pastore","Charles","Lehmann","Rosgan","Exposiciones"];
const MESES = ["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"];
const DIAS = ["Lun","Mar","Mié","Jue","Vie","Sáb","Dom"];
const SUCURSALES = ["AVELLANEDA","CAÑADA DE GOMEZ","CARLOS PELLEGRINI","CERES","CHAJARI","CONCORDIA","LA PAZ","MERCEDES","MORTEROS","OBERA","PARANA","SAN JUSTO","TOTORAS","VICTORIA"];
const EVENT_SUCURSALES = {"eb-001":["MERCEDES"],"eb-002":["MERCEDES"],"eb-003":["MORTEROS"],"eb-005":["MERCEDES"],"eb-006":["LA PAZ"],"eb-007":["SAN JUSTO"],"eb-008":["PARANA"],"eb-009":["MERCEDES"],"eb-010":["CERES"],"eb-013":["MORTEROS"],"eb-014":["PARANA"],"eb-016":["CONCORDIA"],"eb-017":["MERCEDES"],"eb-018":["AVELLANEDA"],"eb-018b":["MERCEDES"],"eb-019":["MERCEDES"],"eb-020":["SAN JUSTO"],"eb-021":["MERCEDES"],"eb-022":["SAN JUSTO"],"eb-024":["MERCEDES"],"eb-025":["MERCEDES"],"eb-026":["SAN JUSTO"],"eb-027":["MERCEDES"],"eb-029":["CERES"],"eb-030":["MERCEDES"],"eb-032":["SAN JUSTO"],"eb-033":["AVELLANEDA"],"eb-034":["SAN JUSTO"],"eb-035":["MORTEROS"],"eb-037":["CERES"],"eb-038":["PARANA"],"eb-039":["CERES"],"eb-040":["AVELLANEDA"],"eb-041":["CERES"],"eb-042":["MERCEDES"],"eb-043":["SAN JUSTO"],"eb-045":["MERCEDES"],"eb-046":["AVELLANEDA"],"afa-c01":["TOTORAS"],"afa-c02":["TOTORAS"],"afa-c04":["TOTORAS"],"afa-c06":["CARLOS PELLEGRINI"],"afa-t01":["TOTORAS"],"afa-t02":["TOTORAS"],"afa-t03":["TOTORAS"],"afa-t04":["TOTORAS"],"afa-t05":["TOTORAS"],"afa-t06":["TOTORAS"],"afa-t07":["TOTORAS"],"afa-t08":["TOTORAS"],"afa-r01":["CARLOS PELLEGRINI"],"afa-r02":["CARLOS PELLEGRINI"],"afa-r03":["CARLOS PELLEGRINI"],"pas-01":["CARLOS PELLEGRINI"],"pas-02":["CARLOS PELLEGRINI"],"pas-03":["CARLOS PELLEGRINI"],"pas-04":["CARLOS PELLEGRINI"],"pas-05":["CARLOS PELLEGRINI"],"pas-06":["CARLOS PELLEGRINI"],"pas-07":["CARLOS PELLEGRINI"],"pas-08":["CARLOS PELLEGRINI"],"pas-09":["CARLOS PELLEGRINI"],"cha-01":["CARLOS PELLEGRINI"],"cha-02":["CARLOS PELLEGRINI"],"leh-emi-08a":["SAN JUSTO"],"leh-sdo-08":["SAN JUSTO"],"leh-sua-08":["MORTEROS"],"leh-rom-08":["AVELLANEDA"],"leh-hel-08":["SAN JUSTO"],"leh-fel-08":["SAN JUSTO"],"leh-emi-08b":["SAN JUSTO"],"leh-cen-09":["CAÑADA DE GOMEZ"],"leh-cen-10":["CAÑADA DE GOMEZ"],"leh-cen-11":["CAÑADA DE GOMEZ"],"leh-cen-12":["CAÑADA DE GOMEZ"],"exp-villaguay":["PARANA"],"exp-villaguay-0801":["PARANA"],"exp-villaguay-0802":["PARANA"],"exp-recon":["AVELLANEDA"],"exp-recon-0808":["AVELLANEDA"],"exp-recon-0809":["AVELLANEDA"],"exp-felic":["LA PAZ"],"exp-felic-0809":["LA PAZ"],"exp-feder":["CONCORDIA"],"exp-feder-0814":["CONCORDIA"],"exp-feder-0815":["CONCORDIA"],"exp-feder-0816":["CONCORDIA"],"exp-nogoya":["VICTORIA"],"exp-nogoya-0815":["VICTORIA"],"exp-nogoya-0816":["VICTORIA"],"exp-sanju":["SAN JUSTO"],"exp-hasenkamp":["LA PAZ"],"exp-hasenkamp-0823":["LA PAZ"],"exp-merce":["MERCEDES"],"exp-vera":["AVELLANEDA"],"exp-goya":["MERCEDES"],"exp-conco":["CONCORDIA"],"exp-chaja":["CHAJARI"]};
const MAP = { latMin:-34, latMax:-27, lngMin:-65, lngMax:-55.5, w:760, h:470 };

function parseFecha(f){ const [y,m,d]=f.split("-").map(Number); return new Date(y,m-1,d); }
function projectPoint(lat,lng){
  const x=((lng-MAP.lngMin)/(MAP.lngMax-MAP.lngMin))*MAP.w;
  const y=((MAP.latMax-lat)/(MAP.latMax-MAP.latMin))*MAP.h;
  return [Math.max(0,Math.min(MAP.w,x)), Math.max(0,Math.min(MAP.h,y))];
}
function formatFecha(r){
  const dt=parseFecha(r.fecha);
  return `${dt.getDate()} de ${MESES[dt.getMonth()]} 2026`;
}
function horaEvento(r){ return r.hora && r.hora !== "00:00" ? `${r.hora} h` : "Hora a confirmar"; }
function pad(n){ return String(n).padStart(2,"0"); }
function addDays(dt,days){ const n=new Date(dt); n.setDate(n.getDate()+days); return n; }
function addHours(dt,hours){ const n=new Date(dt); n.setHours(n.getHours()+hours); return n; }
function compactDate(dt){ return `${dt.getFullYear()}${pad(dt.getMonth()+1)}${pad(dt.getDate())}`; }
function compactDateTime(dt){ return `${compactDate(dt)}T${pad(dt.getHours())}${pad(dt.getMinutes())}00`; }
function localDate(dt){ return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}`; }
function isoLocal(dt){ return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}-${pad(dt.getDate())}T${pad(dt.getHours())}:${pad(dt.getMinutes())}:00`; }
function calendarLinks(r){
  const start=parseFecha(r.fecha);
  const title=`${r.cabana} - ${r.loc}`;
  const details=`${r.tipo}\n${r.firma}\nModalidad: ${r.modalidad}\nFuente: ${r.fuente}`;
  const location=`${r.loc}, ${r.prov}`;
  let googleDates, outlookStart, outlookEnd, allDay;
  if(r.hora && r.hora !== "00:00"){
    const [hh,mm]=r.hora.split(":").map(Number);
    start.setHours(hh,mm,0,0);
    const end=addHours(start,2);
    googleDates=`${compactDateTime(start)}/${compactDateTime(end)}`;
    outlookStart=isoLocal(start);
    outlookEnd=isoLocal(end);
    allDay="false";
  }else{
    googleDates=`${compactDate(start)}/${compactDate(addDays(start,1))}`;
    outlookStart=localDate(start);
    outlookEnd=localDate(addDays(start,1));
    allDay="true";
  }
  const q=new URLSearchParams({action:"TEMPLATE",text:title,dates:googleDates,details,location}).toString();
  const oq=new URLSearchParams({rru:"addevent",subject:title,startdt:outlookStart,enddt:outlookEnd,allday:allDay,body:details,location}).toString();
  return {
    google:`https://calendar.google.com/calendar/render?${q}`,
    outlook:`https://outlook.live.com/calendar/0/deeplink/compose?${oq}`
  };
}
function App(){
  const [REMATES,setRemates]=useState(null);
  const [loadErr,setLoadErr]=useState(null);
  const [vista,setVista]=useState("calendario");
  const [mesIdx,setMesIdx]=useState(6);
  const [fGrupos,setFGrupos]=useState(new Set(GRUPOS));
  const [fProvs,setFProvs]=useState(new Set(PROV_LIST));
  const [fTipos,setFTipos]=useState(new Set());
  const [fSucursales,setFSucursales]=useState(new Set(SUCURSALES));
  const [soloConfirmados,setSoloConfirmados]=useState(false);
  const [sel,setSel]=useState(null);

  useEffect(()=>{
    fetch("remates.json?v="+Date.now())
      .then(r=>{ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(data=>{
        const arr = Array.isArray(data) ? data : (data && Array.isArray(data.remates) ? data.remates : null);
        if (!arr) throw new Error("Formato inesperado en remates.json");
        setRemates(arr);
        setFTipos(new Set([...new Set(arr.map(r=>r.tipo))]));
      })
      .catch(e=>setLoadErr(e.message));
  },[]);

  if(loadErr) return (
    <div className="loadwrap">
      <div className="errbox">
        <b>No se pudo cargar <code>remates.json</code></b><br/><br/>
        {loadErr}<br/><br/>
        Si abriste este archivo con doble clic, el navegador bloquea la carga del JSON.
        Subilo a GitHub Pages (o serví la carpeta con un servidor local) y va a funcionar.
      </div>
    </div>
  );
  if(!REMATES) return <div className="loadwrap"><div className="spin"></div><div>Cargando remates…</div></div>;

  const TIPOS=[...new Set(REMATES.map(r=>r.tipo))].sort();

  const sucursalNames=SUCURSALES;
  const todasSucursales=sucursalNames.length===0 || fSucursales.size===sucursalNames.length;
  const filtrados = REMATES.filter(r => {
    const pasaSucursal = todasSucursales || (EVENT_SUCURSALES[r.id]||[]).some(s=>fSucursales.has(s));
    return fGrupos.has(r.grupo) && fProvs.has(r.prov) && fTipos.has(r.tipo) &&
      (!soloConfirmados || r.confianza==="confirmado") && pasaSucursal;
  });

  const anio=2026;
  const primerDia=new Date(anio,mesIdx,1);
  const offset=(primerDia.getDay()+6)%7;
  const diasEnMes=new Date(anio,mesIdx+1,0).getDate();
  const celdas=[];
  for(let i=0;i<offset;i++)celdas.push(null);
  for(let d=1;d<=diasEnMes;d++)celdas.push(d);
  const porDia={};
  filtrados.forEach(r=>{const dt=parseFecha(r.fecha);
    if(dt.getFullYear()===anio&&dt.getMonth()===mesIdx){const k=dt.getDate();(porDia[k]=porDia[k]||[]).push(r);}});

  const listaOrdenada=[...filtrados].sort((a,b)=>a.fecha.localeCompare(b.fecha));

  const porLocMap={};
  filtrados.forEach(r=>{(porLocMap[r.loc]=porLocMap[r.loc]||{loc:r.loc,prov:r.prov,lat:r.lat,lng:r.lng,items:[]}).items.push(r);});
  const porLoc=Object.values(porLocMap);
  return (
    <div style={S.root}>
      <header style={S.header}>
        <h1 style={S.h1}>Calendario de remates ganaderos</h1>
        <div style={S.tabs}>
          {[["calendario","Calendario"],["lista","Lista"],["mapa","Mapa"]].map(([k,label])=>(
            <button key={k} onClick={()=>setVista(k)} style={{...S.tab,...(vista===k?S.tabActive:{})}}>{label}</button>
          ))}
        </div>
      </header>

      <div style={S.body}>
        <aside style={S.sidebar}>
          <DropdownFilter title="Firma / mercado" options={GRUPOS} selected={fGrupos} setSelected={setFGrupos} colorFor={g=>GRUPO_COLOR[g]}/>
          <DropdownFilter title="Provincia" options={PROV_LIST} selected={fProvs} setSelected={setFProvs} countFor={p=>REMATES.filter(r=>r.prov===p).length}/>
          {sucursalNames.length>0 && <DropdownFilter title="Sucursal" options={sucursalNames} selected={fSucursales} setSelected={setFSucursales}/>} 
          <DropdownFilter title="Tipo de hacienda" options={TIPOS} selected={fTipos} setSelected={setFTipos}/>
          <label style={S.switchRow}>
            <input type="checkbox" checked={soloConfirmados} onChange={e=>setSoloConfirmados(e.target.checked)}/>
            <span>Solo fechas confirmadas</span>
          </label>
          <div style={S.legendBox}>
            <div style={S.legendTitle}>Confianza del dato</div>
            <div style={S.legendItem}><span style={{...S.dot,background:"#111"}}/> Confirmado por la fuente</div>
            <div style={S.legendItem}><span style={S.dotHollow}/> Estimado (recurrencia) — verificar</div>
          </div>
        </aside>

        <main style={S.main}>
          {vista==="calendario" && (
            <div>
              <div style={S.monthNav}>
                <button style={S.navBtn} onClick={()=>setMesIdx(m=>Math.max(0,m-1))} disabled={mesIdx<=0}>‹</button>
                <div style={S.monthLabel}>{MESES[mesIdx]} <span style={{opacity:.5}}>2026</span></div>
                <button style={S.navBtn} onClick={()=>setMesIdx(m=>Math.min(11,m+1))} disabled={mesIdx>=11}>›</button>
              </div>
              <div style={S.grid}>
                {DIAS.map(d=><div key={d} style={S.dow}>{d}</div>)}
                {celdas.map((d,i)=>(
                  <div key={i} style={{...S.cell,...(d?{}:S.cellEmpty)}}>
                    {d && (
                      <div style={{display:"flex",flexDirection:"column",height:"100%"}}>
                        <div style={S.cellNum}>{d}</div>
                        <div style={S.cellEvents}>
                          {(porDia[d]||[]).map(r=>(
                            <button key={r.id} onClick={()=>setSel(r)} className="evt"
                              style={{...S.evt,borderLeft:`3px solid ${GRUPO_COLOR[r.grupo]}`,opacity:r.confianza==="estimado"?0.72:1}}>
                              <span style={S.evtLoc}>{r.loc}</span>
                              <span style={S.evtHora}>{horaEvento(r)}</span>
                              <span style={S.evtFirma}>{r.grupo}{r.confianza==="estimado"?" ·~":""}</span>
                            </button>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          )}

          {vista==="lista" && (
            <div style={S.lista}>
              {listaOrdenada.length===0 && <div style={S.empty}>No hay eventos con estos filtros. Activá más firmas o provincias.</div>}
              {listaOrdenada.map(r=>(
                <button key={r.id} onClick={()=>setSel(r)} className="rowitem" style={S.row}>
                  <div style={{...S.rowDate,color:GRUPO_COLOR[r.grupo]}}>
                    <div style={S.rowDay}>{parseFecha(r.fecha).getDate()}</div>
                    <div style={S.rowMon}>{MESES[parseFecha(r.fecha).getMonth()].slice(0,3)}</div>
                  </div>
                  <div style={{flex:1,textAlign:"left"}}>
                    <div style={S.rowTitle}>{r.cabana}</div>
                    <div style={S.rowMeta}><b>{r.loc}</b>, {r.prov} · {horaEvento(r)} · {r.firma}</div>
                  </div>
                  <div style={S.rowTags}>
                    <span style={{...S.tag,background:GRUPO_COLOR[r.grupo]+"22",color:GRUPO_COLOR[r.grupo]}}>{r.tipo}</span>
                    {r.confianza==="estimado"
                      ? <span style={S.tagEst}>estimado</span>
                      : <span style={S.tagConf}>confirmado</span>}
                  </div>
                </button>
              ))}
            </div>
          )}

          {vista==="mapa" && (
            <div style={S.mapaWrap}>
              <StaticMap porLoc={porLoc} setSel={setSel}/>
            </div>
          )}
        </main>
      </div>

      {sel && (
        <div style={S.overlay} onClick={()=>setSel(null)}>
          <div style={S.modal} onClick={e=>e.stopPropagation()}>
            <div style={{...S.modalBar,background:GRUPO_COLOR[sel.grupo]}}/>
            <button style={S.modalClose} onClick={()=>setSel(null)}>×</button>
            <div style={S.modalTipo}>{sel.tipo}</div>
            <h3 style={S.modalTitle}>{sel.cabana}</h3>
            <div style={S.modalGrid}>
              <Field k="Fecha" v={formatFecha(sel)}/>
              <Field k="Hora" v={horaEvento(sel)}/>
              <Field k="Localidad" v={`${sel.loc}, ${sel.prov}`}/>
              <Field k="Sucursal / zona" v={(EVENT_SUCURSALES[sel.id]||[]).join(", ") || "Fuera de zona"}/>
              <Field k="Firma / mercado" v={sel.firma}/>
              <Field k="Modalidad" v={sel.modalidad}/>
              <Field k="Confianza" v={sel.confianza==="confirmado"?"Confirmado por la fuente":"Estimado por recurrencia — verificar antes de asistir"}/>
              <Field k="Fuente" v={sel.fuente}/>
            </div>
            <CalendarButtons evento={sel}/>
          </div>
        </div>
      )}

      <footer style={S.footer}>
        Datos: e-brangus.com · cooperativalehmann.coop · consignatarias.com.ar · rosgan.com.ar · FARER 2026 ·
        Editá <b>remates.json</b> para actualizar. Las fechas “estimado” provienen de recurrencias y deben confirmarse con la firma.
      </footer>
    </div>
  );
}

function DropdownFilter({title,options,selected,setSelected,colorFor,countFor}){
  const total=options.length;
  const active=options.filter(o=>selected.has(o)).length;
  const all=active===total;
  const toggleOne=(value)=>{
    const next=new Set(selected);
    next.has(value)?next.delete(value):next.add(value);
    setSelected(next);
  };
  return (
    <details style={S.filterBox}>
      <summary style={S.filterSummary}>
        <span>{title}</span>
        <span style={S.filterBadge}>{all?"Todos":`${active}/${total}`}</span>
      </summary>
      <div style={S.filterPanel}>
        <div style={S.filterActions}>
          <button type="button" style={S.filterAction} onClick={()=>setSelected(new Set(options))}>Todos</button>
          <button type="button" style={S.filterAction} onClick={()=>setSelected(new Set())}>Ninguno</button>
        </div>
        {options.map(opt=>{
          const disabled=countFor && countFor(opt)===0;
          return (
            <div key={opt} style={{...S.filterOption,...(disabled?{opacity:.35}: {})}}>
              <label style={S.filterLabel}>
                <input type="checkbox" checked={selected.has(opt)} disabled={disabled} onChange={()=>toggleOne(opt)}/>
                {colorFor && <span style={{...S.dot,background:colorFor(opt)}}/>}
                <span style={{flex:1}}>{opt}{countFor?` (${countFor(opt)})`:""}</span>
              </label>
            </div>
          );
        })}
      </div>
    </details>
  );
}
function Field({k,v}){return <div><div style={S.fieldK}>{k}</div><div style={S.fieldV}>{v}</div></div>;}

function CalendarButtons({evento}){
  const links=calendarLinks(evento);
  return (
    <div style={S.calendarActions}>
      <a href={links.google} target="_blank" rel="noopener noreferrer" style={S.calendarBtn}>Agregar a Google</a>
      <a href={links.outlook} target="_blank" rel="noopener noreferrer" style={S.calendarBtnAlt}>Agregar a Outlook</a>
    </div>
  );
}

function StaticMap({porLoc,setSel}){
  const puntos=porLoc
    .filter(g=>typeof g.lat==="number" && typeof g.lng==="number")
    .map(g=>{
      const [x,y]=projectPoint(g.lat,g.lng);
      const first=g.items[0];
      return {...g,x,y,first,color:GRUPO_COLOR[first.grupo] || "#166534"};
    });

  return (
    <div style={S.mapCard}>
      <div style={S.mapTitle}>Mapa esquemático de localidades</div>
      <div style={S.staticMap} aria-label="Mapa esquemático de localidades con remates">
        <svg viewBox={`0 0 ${MAP.w} ${MAP.h}`} style={S.mapSvg} aria-hidden="true">
          <rect x="0" y="0" width={MAP.w} height={MAP.h} rx="18" fill="#ecfdf5"/>
          <path d="M245 72 C315 42 422 54 491 112 C573 180 592 295 521 390 C456 477 316 462 235 383 C149 300 150 124 245 72 Z" fill="#d9f99d" stroke="#166534" strokeWidth="2" opacity=".72"/>
          <path d="M116 230 C166 188 250 178 314 220 C375 259 388 344 331 400 C275 456 174 437 127 373 C91 323 79 262 116 230 Z" fill="#bbf7d0" stroke="#166534" strokeWidth="1.5" opacity=".62"/>
          <path d="M432 92 C514 111 611 171 646 253 C680 333 642 423 567 443 C606 360 591 249 524 167 C495 132 463 108 432 92 Z" fill="#bfdbfe" stroke="#166534" strokeWidth="1.5" opacity=".55"/>
          <path d="M55 294 C104 250 180 252 226 306 C265 351 244 420 191 447 C129 477 54 435 38 367 C31 337 35 313 55 294 Z" fill="#fde68a" stroke="#166534" strokeWidth="1.5" opacity=".54"/>
          <text x="356" y="250" style={S.mapLabel}>Santa Fe</text>
          <text x="470" y="340" style={S.mapLabel}>Entre Ríos</text>
          <text x="132" y="352" style={S.mapLabel}>Córdoba</text>
          <text x="552" y="216" style={S.mapLabel}>Corrientes</text>
          <text x="626" y="102" style={S.mapLabel}>Misiones</text>
        </svg>
        {puntos.length===0 && <div style={S.mapEmpty}>No hay localidades con estos filtros.</div>}
        {puntos.map(g=>(
          <button
            key={g.loc}
            type="button"
            onClick={()=>setSel(g.first)}
            title={`${g.loc}, ${g.prov}: ${g.items.length} evento${g.items.length===1?"":"s"}`}
            style={{...S.staticMarker,left:`${(g.x/MAP.w)*100}%`,top:`${(g.y/MAP.h)*100}%`,background:g.color}}
          >
            {g.items.length}
          </button>
        ))}
      </div>
      <div style={S.mapNote}>Mapa estático: los puntos son aproximados y no cargan mapas externos.</div>
    </div>
  );
}
